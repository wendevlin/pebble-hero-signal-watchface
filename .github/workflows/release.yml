name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build & attach .pbw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # The Pebble SDK installer builds its Python environment with uv.
      - uses: astral-sh/setup-uv@v6
      - run: bun install
      - name: Install pebble-tool
        run: uv tool install --python 3.12 pebble-tool
      - name: Install Pebble SDK
        run: yes | pebble sdk install 4.44
      - name: Test
        run: bun test
      - name: Build .pbw
        run: bun run build
      - name: Attach .pbw to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/*.pbw
